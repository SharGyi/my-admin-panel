<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Market Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .card { background: #16213e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #00fff5; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #0f3460; color: #fff; font-size: 16px; }
        button { background: #00fff5; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admin Dashboard</h2>
        <p style="text-align:center; color:#bbb;">User အကောင့် ထိန်းချုပ်ရန်</p>
        
        <label>User Balance (USDT):</label>
        <input type="number" id="balanceInput" value="939.10">
        
        <button onclick="updateBalance()">Balance ပြင်ဆင်မည်</button>
    </div>

    <script>
        function updateBalance() {
            let val = document.getElementById('balanceInput').value;
            alert('Balance ကို ' + val + '$ သို့ ပြင်ဆင်လိုက်ပါပြီ');
        }
    </script>
</body>
  </html>
