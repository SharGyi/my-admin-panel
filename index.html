<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmarket - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-gray-200">
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-800">Gmarket Admin</h1>
            </div>
            <nav class="flex md:flex-col overflow-x-auto">
                <a href="#" class="px-6 py-3 text-blue-600 bg-blue-50 md:border-r-4 border-blue-600 font-medium whitespace-nowrap">Users</a>
                <a href="#" class="px-6 py-3 text-gray-600 hover:bg-gray-50 font-medium whitespace-nowrap">Wallets</a>
                <a href="#" class="px-6 py-3 text-gray-600 hover:bg-gray-50 font-medium whitespace-nowrap">Products</a>
                <a href="#" class="px-6 py-3 text-gray-600 hover:bg-gray-50 font-medium whitespace-nowrap">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6">
                <span class="text-lg font-semibold text-gray-700">User Management</span>
                <div class="flex items-center space-x-3">
                    <span class="text-sm text-gray-600">Admin</span>
                </div>
            </header>

            <!-- Content Body -->
            <main class="p-6 flex-1">
                <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b border-gray-200 font-semibold text-gray-700">Users List</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase">
                                    <th class="p-4">Name</th>
                                    <th class="p-4">Email</th>
                                    <th class="p-4">Role</th>
                                    <th class="p-4">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 text-sm text-gray-600">
                                <tr>
                                    <td class="p-4 font-medium text-gray-800">Mg Mg</td>
                                    <td class="p-4">mgmg@example.com</td>
                                    <td class="p-4">User</td>
                                    <td class="p-4"><span class="px-2 py-1 text-xs bg-green-100 text-green-700 rounded-full">Active</span></td>
                                </tr>
                                <tr>
                                    <td class="p-4 font-medium text-gray-800">Aung Aung</td>
                                    <td class="p-4">aungaung@example.com</td>
                                    <td class="p-4">User</td>
                                    <td class="p-4"><span class="px-2 py-1 text-xs bg-green-100 text-green-700 rounded-full">Active</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
